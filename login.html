<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Administración – TroncalInn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --amber:#C8860A; --amber-lt:#E9C46A; --green:#2D6A4F;
      --cream:#FDFAF3; --brown:#6B4226; --text:#2C2C2C; --text-lt:#6B6B6B;
      --danger:#C0392B; --border:#E5DDD0;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:'Nunito',sans-serif;color:var(--text);
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;position:relative;overflow:hidden;
    }
    .bg{
      position:fixed;inset:0;z-index:0;
      background-image:url('https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1600&q=80');
      background-size:cover;background-position:center;
      filter:brightness(.45);
    }

    .card{
      position:relative;z-index:1;
      background:rgba(253,250,243,.96);
      border-radius:24px;padding:2.8rem 2.5rem;
      width:100%;max-width:400px;
      box-shadow:0 24px 60px rgba(0,0,0,.35);
      backdrop-filter:blur(12px);
    }

    .logo{
      text-align:center;margin-bottom:2rem;
    }
    .logo-name{
      font-family:'Playfair Display',serif;
      font-size:2rem;color:var(--brown);line-height:1;
    }
    .logo-sub{
      font-size:.72rem;letter-spacing:3px;text-transform:uppercase;
      color:var(--text-lt);margin-top:.35rem;
    }
    .logo-divider{
      width:40px;height:3px;background:var(--amber-lt);
      border-radius:2px;margin:.9rem auto 0;
    }

    .login-title{
      font-size:.8rem;letter-spacing:2px;text-transform:uppercase;
      color:var(--amber);font-weight:700;margin-bottom:1.5rem;text-align:center;
    }

    .form-group{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1.1rem}
    label{font-size:.75rem;font-weight:700;color:var(--text-lt);letter-spacing:.5px;text-transform:uppercase}
    .input-wrap{position:relative}
    input[type=text],input[type=password]{
      width:100%;border:2px solid var(--border);border-radius:12px;
      padding:.75rem 2.8rem .75rem 1rem;font-family:'Nunito',sans-serif;
      font-size:1rem;color:var(--text);background:var(--cream);outline:none;
      transition:border-color .25s;
    }
    input:focus{border-color:var(--amber)}
    .toggle-pw{
      position:absolute;right:.9rem;top:50%;transform:translateY(-50%);
      background:none;border:none;cursor:pointer;font-size:1.1rem;
      color:var(--text-lt);padding:0;line-height:1;
    }

    .error-msg{
      background:#fdf0ef;border:2px solid #f5c6c3;
      color:var(--danger);border-radius:10px;
      padding:.65rem 1rem;font-size:.85rem;font-weight:600;
      margin-bottom:1rem;display:none;text-align:center;
    }
    .error-msg.show{display:block}

    .btn-login{
      width:100%;background:var(--amber);color:#fff;border:none;
      padding:.85rem;border-radius:30px;font-family:'Nunito',sans-serif;
      font-size:1rem;font-weight:700;cursor:pointer;
      transition:background .3s,transform .15s;margin-top:.3rem;
      display:flex;align-items:center;justify-content:center;gap:.5rem;
    }
    .btn-login:hover{background:var(--brown);transform:translateY(-2px)}
    .btn-login:active{transform:translateY(0)}
    .btn-login.loading{opacity:.7;pointer-events:none}

    .back-link{
      display:block;text-align:center;margin-top:1.4rem;
      font-size:.82rem;color:var(--text-lt);text-decoration:none;
      transition:color .2s;
    }
    .back-link:hover{color:var(--amber)}

    /* shake animation on error */
    @keyframes shake{
      0%,100%{transform:translateX(0)}
      20%,60%{transform:translateX(-8px)}
      40%,80%{transform:translateX(8px)}
    }
    .shake{animation:shake .4s ease}
  </style>
</head>
<body>

<div class="bg"></div>

<div class="card" id="loginCard">
  <div class="logo">
    <div class="logo-name">TroncalInn</div>
    <div class="logo-sub">Administración</div>
    <div class="logo-divider"></div>
  </div>

  <p class="login-title">🔒 Acceso restringido</p>

  <div class="error-msg" id="errorMsg">Usuario o contraseña incorrectos</div>

  <form id="loginForm" onsubmit="doLogin(event)" autocomplete="off">
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" id="username" placeholder="Ingresa tu usuario" autocomplete="off" required />
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="••••••••" autocomplete="off" required />
        <button type="button" class="toggle-pw" onclick="togglePw()" id="eyeBtn" title="Mostrar/ocultar">👁️</button>
      </div>
    </div>
    <button type="submit" class="btn-login" id="loginBtn">
      <span>Entrar al panel</span>
    </button>
  </form>

  <a href="index.html" class="back-link">← Volver al sitio web</a>
</div>

<script>
  /*
   * CREDENCIALES DE ACCESO
   * Cambia los valores de USER y PASS para personalizar el acceso.
   * Guarda el archivo y el nuevo acceso estará activo.
   */
  const CREDENTIALS = {
    user: 'admin',
    pass: 'TroncalInn2026'
  };

  let attempts = 0;

  function doLogin(e) {
    e.preventDefault();
    const btn  = document.getElementById('loginBtn');
    const err  = document.getElementById('errorMsg');
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;

    btn.classList.add('loading');
    btn.querySelector('span').textContent = 'Verificando...';

    // Pequeño delay para efecto visual
    setTimeout(() => {
      if (user === CREDENTIALS.user && pass === CREDENTIALS.pass) {
        sessionStorage.setItem('troncalinn_auth', 'true');
        btn.querySelector('span').textContent = '✓ Acceso concedido';
        btn.style.background = '#27AE60';
        setTimeout(() => { window.location.href = 'admin.html'; }, 600);
      } else {
        attempts++;
        btn.classList.remove('loading');
        btn.querySelector('span').textContent = 'Entrar al panel';
        err.classList.add('show');
        document.getElementById('loginCard').classList.add('shake');
        setTimeout(() => document.getElementById('loginCard').classList.remove('shake'), 400);
        document.getElementById('password').value = '';
        document.getElementById('password').focus();

        if (attempts >= 5) {
          // Bloqueo temporal tras 5 intentos fallidos
          btn.disabled = true;
          btn.querySelector('span').textContent = 'Bloqueado 30 seg...';
          err.textContent = 'Demasiados intentos. Espera 30 segundos.';
          let t = 30;
          const interval = setInterval(() => {
            t--;
            btn.querySelector('span').textContent = `Bloqueado ${t} seg...`;
            if (t <= 0) {
              clearInterval(interval);
              btn.disabled = false;
              btn.querySelector('span').textContent = 'Entrar al panel';
              err.textContent = 'Usuario o contraseña incorrectos';
              attempts = 0;
            }
          }, 1000);
        }
      }
    }, 500);
  }

  function togglePw() {
    const pw  = document.getElementById('password');
    const eye = document.getElementById('eyeBtn');
    if (pw.type === 'password') { pw.type = 'text'; eye.textContent = '🙈'; }
    else                        { pw.type = 'password'; eye.textContent = '👁️'; }
  }

  // Si ya está autenticado, ir directo al admin
  if (sessionStorage.getItem('troncalinn_auth') === 'true') {
    window.location.href = 'admin.html';
  }
</script>
</body>
</html>
